name: Cancel closed PR checks

on:
  # The base context supplies actions:write even for forks. Never run PR code.
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Older PR base SHAs may predate this helper. Always use trusted main.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const cancel = require('./.github/scripts/cancel-pr-runs.cjs');
            await cancel({ github, context, core });
