name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.6'
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify reviewed source and version
        run: |
          git merge-base --is-ancestor HEAD origin/main
          uv run --locked python - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          import json
          assert json.load(open('sdk/typescript/package.json'))['version'] == version
          assert open('sdk/typescript/src/version.ts').read().strip() == f'export const VERSION = "{version}";'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version
          PY
      - name: Test, build and check
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pyright
          uv run --locked pytest
          uv build
          uv run --locked twine check dist/*
          uv venv "$RUNNER_TEMP/install"
          uv pip install --python "$RUNNER_TEMP/install/bin/python" dist/*.whl
          "$RUNNER_TEMP/install/bin/python" scripts/smoke.py
          uv venv "$RUNNER_TEMP/source"
          uv pip install --python "$RUNNER_TEMP/source/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/source/bin/python" scripts/smoke.py
      - name: TypeScript SDK and shared API contract
        run: |
          npm --prefix sdk/typescript ci
          npm --prefix sdk/typescript run typecheck
          npm --prefix sdk/typescript test
          uv run --locked python scripts/check_contract.py
          npm --prefix sdk/typescript run check:openapi
          uv run --locked pytest contracts
          npm pack ./sdk/typescript --pack-destination dist
          node sdk/typescript/scripts/verify-package.mjs dist/readlint.com-*.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  github:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish immutable versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never replace bytes on a rerun; detect a partial upload instead.
            mkdir "$RUNNER_TEMP/published"
            gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
            for file in dist/*.whl dist/*.tar.gz dist/*.tgz; do
              test -f "$RUNNER_TEMP/published/$(basename "$file")"
            done
            (cd "$RUNNER_TEMP/published" && sha256sum --check SHA256SUMS)
          else
            (cd dist && sha256sum ./*.whl ./*.tar.gz ./*.tgz > SHA256SUMS)
            gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --repo "$GITHUB_REPOSITORY" --title "readlint.com $GITHUB_REF_NAME" --generate-notes
          fi
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
          fi

  pypi:
    name: Publish to PyPI
    if: ${{ vars.PYPI_TRUSTED_PUBLISHING == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Keep npm archives outside the PyPI upload
        run: rm dist/*.tgz
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true

  npm:
    name: Publish to npm
    if: ${{ vars.NPM_TRUSTED_PUBLISHING == 'true' || vars.NPM_BOOTSTRAP_PUBLISH == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Check publishing client
        run: |
          npm_version=$(npm --version)
          echo "npm $npm_version"
          IFS=. read -r npm_major npm_minor npm_patch <<< "$npm_version"
          if (( npm_major < 11 || (npm_major == 11 && (npm_minor < 5 || (npm_minor == 5 && npm_patch < 1))) )); then
            echo "npm >=11.5.1 is required for trusted publishing" >&2
            exit 1
          fi
      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ vars.NPM_BOOTSTRAP_PUBLISH == 'true' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          BOOTSTRAP: ${{ vars.NPM_BOOTSTRAP_PUBLISH }}
        run: |
          if [ "$BOOTSTRAP" = true ]; then test -n "$NODE_AUTH_TOKEN"; fi
          npm publish dist/readlint.com-*.tgz --provenance --access public
