name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

# Only PR checks share a cancelling group. Main, schedule and manual runs are
# independent, so new runs cannot cancel an earlier main or release run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-{1}', github.workflow, github.ref) || format('{0}-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.changes.outputs.python }}
      typescript: ${{ steps.changes.outputs.typescript }}
      contract: ${{ steps.changes.outputs.contract }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci_changes.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cancellation safety tests
        run: node --test .github/scripts/cancel-pr-runs.test.cjs
      - name: Whitespace
        run: git diff --check HEAD^ HEAD

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: '3.11', os: ubuntu-latest}
          - {python: '3.13', os: ubuntu-latest}
          - {python: '3.13', os: macos-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.6'
          python-version: ${{ matrix.python }}
      - name: Lint, types and tests
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pyright
          uv run --locked pytest
      - name: Build and verify both distributions
        run: |
          uv build
          uv run --locked twine check dist/*
          uv venv "$RUNNER_TEMP/wheel"
          uv pip install --python "$RUNNER_TEMP/wheel/bin/python" dist/*.whl
          "$RUNNER_TEMP/wheel/bin/python" scripts/smoke.py
          uv venv "$RUNNER_TEMP/sdist"
          uv pip install --python "$RUNNER_TEMP/sdist/bin/python" dist/*.tar.gz
          "$RUNNER_TEMP/sdist/bin/python" scripts/smoke.py

  typescript:
    name: TypeScript SDK / Node ${{ matrix.node }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.typescript != 'false' }}
    strategy:
      matrix:
        node: ['22', '24']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm --prefix sdk/typescript ci
      - run: npm --prefix sdk/typescript run typecheck
      - run: npm --prefix sdk/typescript test
      - name: Verify distributed package in a clean consumer
        run: |
          mkdir -p dist
          npm pack ./sdk/typescript --pack-destination dist
          node sdk/typescript/scripts/verify-package.mjs dist/readlint.com-*.tgz

  contract:
    name: API client drift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.contract != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.6'
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix sdk/typescript ci
      - run: uv run --locked python scripts/check_contract.py
      - run: npm --prefix sdk/typescript run check:openapi
      - run: npm --prefix sdk/typescript run build
      - name: Shared contract lint and types
        run: |
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked pyright
      - run: uv run --locked pytest contracts tests
