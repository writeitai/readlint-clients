[project]
name = "readlint"
version = "0.2.0"
description = "Python SDK and command-line client for readlint.com"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "readlint.com"}]
dependencies = ["httpx>=0.28.1,<1"]

[project.urls]
Homepage = "https://readlint.com"
Documentation = "https://github.com/writeitai/readlint-clients/tree/main/docs"
Repository = "https://github.com/writeitai/readlint-clients"

[project.scripts]
readlint = "readlint.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
    "pyright[nodejs]==1.1.414",
    "twine>=6,<7",
    "jsonschema>=4.25,<5",
]

[tool.ruff]
target-version = "py311"
extend-exclude = [".agents", ".claude"]

[tool.ruff.lint]
extend-select = ["I", "B", "A"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts", "contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
